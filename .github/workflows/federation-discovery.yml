name: Federation Discovery

# Federation HQ posture (v0.1.0): read-only scheduled health check. Discovers
# federation peers and verifies their authority feeds on a schedule and on
# demand. No commit or push step: nothing is written to any branch, no bypass
# actor, no automatic pull-request creation, no persistence service.

on:
  schedule:
    - cron: "0 6 * * 1"       # weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-peers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover federation peers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover_federation_peers.py --output .federation/peers.json --repo "$GITHUB_REPOSITORY"

      - name: Fetch and verify peer authority feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .federation/peers.json ]; then
            python scripts/fetch_peer_authority.py --peers .federation/peers.json --output-dir .federation/peer-feeds
          fi
