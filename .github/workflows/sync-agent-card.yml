name: Check Agent Card

# Federation HQ posture (v0.1.0): no bot pushes to the protected default
# branch. The agent card is regenerated and committed through normal feature
# branches and PRs; this workflow renders it in CI and fails on drift.

on:
  pull_request:
    paths:
      - ".well-known/**"
      - "docs/authority/**"
      - "scripts/render_agent_card.py"
      - "scripts/render_federation_descriptor.py"
      - "scripts/federation_utils.py"
  push:
    branches: [main]
    paths:
      - ".well-known/**"
      - "docs/authority/**"
      - "scripts/render_agent_card.py"
      - "scripts/render_federation_descriptor.py"
      - "scripts/federation_utils.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-agent-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render agent card and compare with committed
        run: |
          python scripts/render_agent_card.py --output /tmp/agent-card.json --repo "$GITHUB_REPOSITORY"
          if ! diff -u .well-known/agent.json /tmp/agent-card.json; then
            echo "::error::Agent card drift: .well-known/agent.json does not match the renderer output. Regenerate with scripts/render_agent_card.py and commit through a feature branch PR (no direct push to main)."
            exit 1
          fi
