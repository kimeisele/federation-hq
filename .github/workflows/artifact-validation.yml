name: Artifact Contract Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate artifact contracts
        run: python scripts/validate_artifacts.py

      - name: Run artifact contract tests
        run: python -m pytest tests/test_artifact_contracts.py -q
