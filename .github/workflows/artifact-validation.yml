name: Artifact Contract Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install full dependency profile
        run: python -m pip install -e ".[dev,federation]"

      - name: Validate artifact contracts
        run: python scripts/validate_artifacts.py

      - name: Run full test suite
        run: python -m pytest tests/ -q

      - name: Lint
        run: python -m ruff check .
