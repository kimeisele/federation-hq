name: Check Federation Descriptor

# Federation HQ posture (v0.1.0): no bot pushes to the protected default
# branch. The federation descriptor is regenerated and committed through
# normal feature branches and PRs; this workflow renders it in CI and fails
# on drift.

on:
  pull_request:
    paths:
      - ".well-known/**"
      - "docs/authority/**"
      - "scripts/render_agent_card.py"
      - "scripts/render_federation_descriptor.py"
      - "scripts/federation_utils.py"
  push:
    branches: [main]
    paths:
      - ".well-known/**"
      - "docs/authority/**"
      - "scripts/render_agent_card.py"
      - "scripts/render_federation_descriptor.py"
      - "scripts/federation_utils.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render federation descriptor and compare with committed
        run: |
          python scripts/render_federation_descriptor.py --output /tmp/descriptor.json --repo "$GITHUB_REPOSITORY" --layer node
          if ! diff -u .well-known/agent-federation.json /tmp/descriptor.json; then
            echo "::error::Federation descriptor drift: .well-known/agent-federation.json does not match the renderer output. Regenerate with scripts/render_federation_descriptor.py and commit through a feature branch PR (no direct push to main)."
            exit 1
          fi
