objective: >
  Determine whether the Moltbook outbound fallback discrepancy represented by
  tests/test_treasury.py::TestMoltbookOutboundFallback::test_fallback_path_exists
  is a production defect, stale test contract, lost compatibility contract,
  or another single bounded cause at the exact pinned baseline.
decision_question: >
  What is the authoritative current contract for Moltbook outbound fallback
  behavior, and which single bounded artifact or implementation is wrong?
bounded_scope: >
  Investigate the focused test, the current MOKSHA outbound hook
  implementation and registration, the relevant Moltbook outbound/outbox or
  bridge path, and the history that replaced or removed the referenced
  MoltbookOutboundHook. Select at most one repair candidate.
scope_enforcement: declared
prescribes_repair: false
hard_constraints:
  - Reproduce the focused test behavior before selecting a repair.
  - Do not reintroduce MoltbookOutboundHook merely to satisfy an obsolete test.
  - Do not remove or redesign the current outbound architecture merely because the old class is absent.
  - Determine intended behavior from current callers, hook registration, tests, documentation, and git history.
  - Preserve working event-driven/outbox semantics unless evidence proves they are defective.
  - Exactly one bounded repair candidate.
  - No Federation HQ architecture changes.
  - No Review Gate changes.
stop_conditions:
  - The focused signal does not reproduce or no longer exists at the pinned baseline.
  - An active overlapping PR already owns the same defect.
  - Evidence shows the question requires a broader product-policy decision rather than a bounded repair.
  - Required repository evidence cannot be verified.
