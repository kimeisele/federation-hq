# Director cycle director-cycle-20260811-resource-governance-benchmark-01
# (kimeisele/federation-hq#43).
# Bounded Recon Mission: the investigation itself is the mission (POL-11).
# The agent-city#14 prose is evidence of a reported work item, NOT proof that
# all three gaps still exist and NOT a repair prescription; the Scout
# determines current reality at the exact pinned baseline.
kind: federation_hq_mission_contract
mission_version: "0.1.0"
mission_id: mission-20260811-agent-city-state-reliability-hot-reload-recon
source_candidate_id: cand-20260811-agent-city-state-reliability-hot-reload-recon
signal_refs:
  - signal_id: sig-20260811-agent-city-issue-14-state-reliability-hot-reload
    source_kind: github_issue
    repository: kimeisele/agent-city
    source_native_ref: kimeisele/agent-city#14
target_repository: kimeisele/agent-city
objective: >
  Recon: determine which, if any, of the three Layer-7 State Reliability /
  Hot-Reload areas reported in agent-city#14 (atomic state writes with backup
  recovery; config hot-reload during heartbeat; state versioning/migration)
  remain reproducible at the exact pinned Agent City baseline — the
  investigation itself is the mission.
decision_question: >
  At the exact pinned Agent City baseline, which (if any) of the reported
  #14 gaps remain present, and what single bounded remediation (if any) is
  warranted?
bounded_scope: >
  Scout-only recon: inspect the current Layer-7 state/persistence/config
  surfaces (state service and council save/load roundtrip, config load and
  hot-reload path, backup rotation and recovery, state versioning/migration),
  the relevant tests, and history, to determine the current reality of each
  reported area at the pinned baseline. Report exactly one evidence-backed
  repair candidate or none.
scope_enforcement: declared
prescribes_repair: false
hard_constraints:
  - "The Scout performs the source investigation; the Director does not (POL-11)."
  - "Do not assume any #14 gap is still present or absent; determine current reality from repository evidence at the pinned baseline."
  - "Issue #14 prose is a report of a work item, NOT a repair prescription: do not implement the Issue's listed items merely because the Issue listed them."
  - "Evaluate each reported area (atomic writes/backup recovery, config hot-reload, state versioning/migration) against the exact current baseline."
  - "Do not change production semantics unless evidence proves a defect (POL-08)."
  - "Exactly one bounded repair candidate or none."
  - "No Federation HQ architecture changes; no Review Gate changes."
stop_conditions:
  - "None of the reported gaps can be verified as reproducible at the pinned baseline and no evidence-backed defect is found."
  - "An active overlapping PR/issue already owns the same gap(s)."
  - "The question requires a broader product-policy decision rather than a bounded finding."
  - "Required repository evidence cannot be verified."
expected_allowed_outcomes:
  - approved
  - changes_requested
  - blocked
  - invalid_candidate
  - mission_rejected
policy_reference: docs/HQ_MISSION_POLICY.md
policy_version: "0.1.0"
