    sha256: 6940ea39da9799fa6595809cfce6a948427bdc07edba2e48774418642fe6eb8a
    status: released
    released: '2026-08-05'
    changelog: 'Initial release for the three-role repair workflow: bounded investigation,
      single-candidate selection, evidence-anchored output, artifact-output contract
      (exactly one artifact, writable run-output directory only, never mutate Federation
      HQ).

      '
  - version: 0.2.0
    file: scout/v0.2.0.md
    sha256: eb93cbb94d489df94cd64cde59316fcb650f344244c097c11e024b0093011837
    status: released
    released: '2026-08-10'
    changelog: 'MINOR additive release (Issue #25): MissionContract-native runs. When
      the manifest pins mission_input, the MissionContract is the durable semantic
      scope; Scout may contradict the mission''s initial hypothesis (POL-09) but may
      not broaden the contract; resolves the exact pinned contract itself, never Operator
      prose as authority. Prior artifacts unaffected.'
- id: repair
  name: Targeted Repair Builder
  description: Repairs exactly the selected candidate and records a verifiable repair
    result.
  versions:
  - version: 0.1.0
    file: repair/v0.1.0.md
    sha256: 0606d8ed7bec4501c10613d8e13b399325d6245b72f5d9212ea65e459f933f84
    status: released
    released: '2026-08-05'
    changelog: 'Initial release for the three-role repair workflow: single-candidate
      scope, baseline-versus-head failure comparison, no admin bypass, artifact-output
      contract (exactly one artifact, writable run-output directory only, never mutate
      Federation HQ).

      '
  - version: 0.2.0
    file: repair/v0.2.0.md
    sha256: d997d221e88cd5904a62ac2580aa1a91197e96c48587a43b3200e459c26064c7
    status: released
    released: '2026-08-10'
    changelog: 'MINOR additive release (Issue #25): MissionContract-native runs. The
      accepted RepairCandidate determines the concrete repair; the pinned MissionContract''s
      bounded_scope/hard_constraints remain binding declared scope; no reinterpretation
      of mission selection. Prior artifacts unaffected.'
  - version: 0.2.1
    file: repair/v0.2.1.md
    sha256: 2830ae50c209ae116671f1f840352b416ce26f8304cb78ee277fd9721a9b1d0f
    status: released
    released: '2026-08-11'
    changelog: 'PATCH additive release (Issue #39): Execution Resource Governance
      v0.1. Focused-first verification (reproduce candidate on baseline with focused
      evidence, verify with focused/relevant regression tests, repo-native lint/type/static
      checks); broad/full suite permitted only when repo governance requires, broad
      cross-cutting effects, or bounded checks cannot establish safety — max 1 broad/full-suite
      execution per repair attempt; heavy retry circuit breaker (0 identical retries
      after timeout/SIGTERM/resource exhaustion; choose bounded verification, alternative
      evidence, or blocked environment_resource_exhaustion; retry only on concrete
      environment recovery, recorded); host-pressure preflight before heavy commands
      (scripts/check_execution_pressure.py, PRESSURED blocks start, UNKNOWN does not);
      environmental timeout classification recorded instead of repeated reruns. repair@0.2.0
      bytes immutable; prior artifacts unaffected. PR-local review fix: successor
      files self-identify as their new release (2026-08-11); default normalized pressure
      threshold = 1.5 (conservative v0.1 heuristic, configurable, load average is
      a pressure signal not CPU utilization); HEAVY commands execute through the mechanical
      host-local guard scripts/run_heavy_command.py (per-run fcntl.flock lease + pressure
      preflight + child launch as one bounded operation; BUSY/PRESSURED refusals are
      coordination outcomes, not semantic failures).'
- id: review
  name: Independent Repair Reviewer
  description: Independently verifies the exact remote head and records a verdict.
  versions:
  - version: 0.1.0
