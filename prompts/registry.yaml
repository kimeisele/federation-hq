    sha256: 82b9cc37176304d418a934b261fa5efa2374d4e886c5afdec3789eaa264479e9
    status: released
    released: '2026-08-05'
    changelog: 'Initial release for the three-role repair workflow: exact-head re-verification,
      claim-to-evidence checking, four verdicts, approval invalidated by new commits,
      artifact-output contract (exactly one artifact, writable run-output directory
      only, never mutate Federation HQ).

      '
  - version: 0.2.0
    file: review/v0.2.0.md
    sha256: 53ca110b92ded24522b04c247ea1abd808180047dd84f64304eb5591e70dad5e
    status: released
    released: '2026-08-10'
    changelog: 'MINOR additive release (Issue #25): MissionContract-native runs. Review
      independently verifies both repair correctness and compliance with the pinned
      MissionContract boundaries; no approval of repairs exceeding the contract; independence
      from Repair unchanged. Prior artifacts unaffected.'
  - version: 0.2.1
    file: review/v0.2.1.md
    sha256: d3e59db52d144a4aeebbb149a09f1266c4948cb4d37007327966f42eee875247
    status: released
    released: '2026-08-11'
    changelog: 'PATCH additive release (Issue #39): Execution Resource Governance
      v0.1. Reviewer NOT required to rerun every repair_result command — independently
      verifies every material semantic claim via the cheapest sufficient evidence
      path; differential regression strategy (focused tests at head -> neighboring/component
      tests -> at most one broad head run -> baseline replay of ONLY exact head failing
      test IDs + concrete suspects); Reviewer broad/full-suite budget default 1, absolute
      max 2 per review attempt (second requires stating the concrete unresolved question
      first), never a third; heavy retry circuit breaker (0 identical retries after
      timeout/SIGTERM/resource exhaustion); host-pressure preflight before heavy commands;
      environmental classification (deterministic regression vs environment-induced
      timeout only with evidence; residual uncertainty -> blocked environment_resource_exhaustion;
      no indefinite retry); exact-SHA CI usable as independent broad-suite evidence.
      Semantic Review independence unchanged. review@0.2.0 bytes immutable; prior
      artifacts unaffected. PR-local review fix: successor files self-identify as
      their new release (2026-08-11); default normalized pressure threshold = 1.5
      (conservative v0.1 heuristic, configurable, load average is a pressure signal
      not CPU utilization); HEAVY commands execute through the mechanical host-local
      guard scripts/run_heavy_command.py (per-run fcntl.flock lease + pressure preflight
      + child launch as one bounded operation; BUSY/PRESSURED refusals are coordination
      outcomes, not semantic failures).'
- id: operator
  name: HQ Operator
  description: Coordinates the three-role repair workflow via GitHub-native structured
    Issue comments.
  versions:
  - version: 0.1.0
    file: operator/v0.1.0.md
    sha256: 17cd6f0e046dd75dd9393aabec80f409c5fc50ed8bfdb1097357f6069ff45a2c
    status: released
    released: '2026-08-05'
    changelog: 'Initial release for the HQ Operator coordination role: exactly one
      active role assignment per run, structural artifact acceptance, Issue-based
      coordination, no merge authority, no semantic repair judgment, no autonomous
      target selection, no model invocation. Pre-merge finalization (unmerged PR #3):
      submission references delivered bytes with hq_commit_sha null; acceptance references
      the canonical run-record branch commit with a matching hash; acceptance and
      next assignment are separate messages. No run pinned the earlier draft bytes.

      '
  - version: 0.2.0
    file: operator/v0.2.0.md
    sha256: 6e054aa82e87608713d858e3f2b5116a33098e4fb4b5b867d63fc32b874a2994
    status: released
    released: '2026-08-09'
    changelog: 'MINOR additive release (Issue #15): automated role execution v0.1.
      Adds optional execution-adapter dispatch — the Operator may launch an ISOLATED
      role worker (scout/repair/review) through a compatible adapter instead of waiting
      for an external actor, observe its submission, and continue the normal validate
      -> canonicalize -> accept -> next-assignment loop. New section ''Automated role
      dispatch (execution adapters)'' plus failure-visibility and fallback rules;
      independence invariant (repair and review run in distinct worker contexts; review
      never inherits repair''s private reasoning); return-to-human conditions narrowed
      to terminal completion, policy decisions, unrecoverable execution failure, and
      permission/credential boundaries. Canonical protocol, artifacts, prompt pins,
      and Gate semantics unchanged; external/manual dispatch remains the supported
      fallback; no harness becomes part of the protocol vocabulary. Does not invalidate
      prior artifacts or runs pinned to operator@0.1.0.

      '
  - version: 0.2.1
    file: operator/v0.2.1.md
    sha256: 1638cb9876fdfe0184c596b6ea0fd8c8621fb96db63a55c4f9bd1abf30675de5
    status: released
    released: '2026-08-09'
    changelog: 'PATCH clarification (Issue #15 bounded review, PR #16): makes Integrator
      auto-dispatch explicit in the automated-dispatch section. After a canonical
      approved Review verdict, the Operator MAY spawn an isolated hq-integrator worker
      through the same execution adapter (mechanical, execution-only, not a new pipeline
      state and not a semantic Reviewer); manual/external Integrator handoff remains
      the fallback when no adapter is available. No state machine, coordination-message
      type, protocol, artifact, or Gate semantics changed. operator@0.2.0 bytes remain
      immutable.

      '
  - version: 0.3.0
    file: operator/v0.3.0.md
    sha256: c06adf517332b57aa7e300bf7cac43bd2ac2e6131181add5b85f39356e9cac79
    status: released
    released: '2026-08-10'
    changelog: 'MAJOR release (Issue #25): MissionContract-native Operator. New authoritative
      mission input mode (mission_input pin: exact canonical MissionCandidate + MissionContract
      paths/HQ commit SHAs/SHA-256); mission admission validation (schema/policy pin/ledger
      reopen guard/provenance chain); structural integrity failure -> bounded input
      blocker, semantic framing violation -> terminal_outcome mission_rejected + ledger_disposition
      rejected via RunAssessment (run_id null) with zero Scout dispatch; admitted
      missions pin mission_input and proceed through the unchanged pipeline. Forbidden:
      semantic rewriting of the MissionContract into an invented maintenance_request;
      inventing a mission decision from corrupted input. Legacy maintenance_request
      mode unchanged and still supported; no runtime pipeline/state-machine/Gate changes;
      no Director. PR-local review fix: admission evaluated against the exact point-in-time
      admission-time ledger snapshot (mission_input.admission_ledger pin); live-ledger
      mutations never change historical admission validity.'
  - version: 0.3.1
    file: operator/v0.3.1.md
    sha256: 20aa6bacd660da8438a7098f70032560f36688ea125cfb8da9ad18fcbdaa01cc
    status: released
    released: '2026-08-11'
    changelog: 'PATCH coordination release (Issue #39): Execution Resource Governance
      v0.1. Assignments reference the governance (focused-first verification, heavy-command
      budgets, heavy retry circuit breaker, host-pressure preflight); at most ONE
      concurrent heavy verification command per run; a worker timeout is NOT license
      for endless re-dispatch/retry of the same heavy verification; persistent worker
      resource exhaustion (environment_resource_exhaustion) after bounded verification
      terminalizes the run blocked with the concrete environmental cause via the existing
      blocker terminalization path. No state-machine, protocol, artifact, or Gate
      semantics changed; Operator still performs no tests itself and no semantic review
      authority moves to Operator. operator@0.3.0 bytes immutable; prior artifacts
      unaffected. PR-local review fix: successor files self-identify as their new
      release (2026-08-11); default normalized pressure threshold = 1.5 (conservative
      v0.1 heuristic, configurable, load average is a pressure signal not CPU utilization);
      HEAVY commands execute through the mechanical host-local guard scripts/run_heavy_command.py
      (per-run fcntl.flock lease + pressure preflight + child launch as one bounded
      operation; BUSY/PRESSURED refusals are coordination outcomes, not semantic failures).'
- id: director
  name: HQ Mission Director
  description: HQ Mission Director — selects at most one bounded mission from explicit
    structured signals using canonical Policy, Ledger and terminal feedback; may legitimately
    select none; never performs Scout/Operator/Review work.
  versions:
  - version: 0.1.0
    file: director/v0.1.0.md
    sha256: 69f5e26c9411c6f466fc873356f6a50911c633900849af54d966572d5d24126e
    status: released
    released: '2026-08-10'
    changelog: 'Initial release (Issue #33, ADR-0002 step 4): HQ Mission Director
      v0.1. Bounded mission-formulation role: one invocation = one decision cycle,
      at most one MissionContract; finite explicit signal set + canonical Policy/Ledger/terminal
      feedback; cheap evidence only (no deep recon; Recon Missions route through the
      Operator); no self-scoring; POL-01..07, 10, 11, 14, 15; v0.1 tie boundary (ambiguous
      selection -> BLOCKED/no selection); terminal prior dispositions never silently
      reopened (POL-04 override required); no-mission is a valid outcome; canonical
      handoff to an isolated Operator (operator@0.3.0 admission). PR-local review
      fix: explicit formulation-integration authority — the Director NORMAL-merges
      its own validated formulation PR (missions/<mission-id>/{mission-candidate,mission-contract}.yaml
      + mission/ledger.yaml only; no --admin/force/protection changes; blocked ->
      BLOCKED — formulation integration, no Operator spawn) and hands the Operator
      ONLY the exact merged HQ commit + canonical references (never a PR head or branch
      name). PR-local final review fix: explicit time ordering — the POL-04 admission
      Ledger basis B is captured at the exact pre-formulation HQ main commit and hashed
      BEFORE any formulation mutation; the Operator handoff uses Candidate@C + Contract@C
      + AdmissionLedger@B (mixed-commit pins expected); blocked variants BLOCKED —
      formulation integration / BLOCKED — admission ledger basis. PR-local persistence
      fix: explicit no-mission Ledger persistence — NEW terminal non-mission decisions
      project into mission/ledger.yaml ONLY and are NORMAL-merged as the Director''s
      Ledger-only decision PR (BLOCKED — Director decision persistence if unmergeable);
      already-terminal signals are reported without redundant mutation; ambiguous
      cycles are never terminalized; no-mission cycles spawn no workers.'
