# Federation HQ Prompt Registry
#
# Versioned role prompts for the repair workflow.
#
# Schema and rules: see `docs/PROMPT_VERSIONING.md`. Released versions are
# immutable; every release requires a changelog rationale. Each version pins
# the SHA-256 of its exact UTF-8 file bytes. Validated by
# `scripts/validate_artifacts.py` (unique ids, unique versions, referenced
# files exist, changelog present, hashes match file bytes). Only entries with
# `status: released` are pinnable by run manifests.
#
# The four `0.1.0` versions below are released with their respective PR
# merges; release status is never mutated automatically.

schema_version: 1
prompts:
  - id: scout
    name: Unwired Functionality Scout
    description: Investigates a bounded maintenance request and selects exactly one repair candidate.
    versions:
      - version: 0.1.0
        file: scout/v0.1.0.md
        sha256: "6940ea39da9799fa6595809cfce6a948427bdc07edba2e48774418642fe6eb8a"
        status: released
        released: "2026-08-05"
        changelog: >
          Initial release for the three-role repair workflow: bounded
          investigation, single-candidate selection, evidence-anchored output,
          artifact-output contract (exactly one artifact, writable run-output
          directory only, never mutate Federation HQ).

  - id: repair
    name: Targeted Repair Builder
    description: Repairs exactly the selected candidate and records a verifiable repair result.
    versions:
      - version: 0.1.0
        file: repair/v0.1.0.md
        sha256: "0606d8ed7bec4501c10613d8e13b399325d6245b72f5d9212ea65e459f933f84"
        status: released
        released: "2026-08-05"
        changelog: >
          Initial release for the three-role repair workflow: single-candidate
          scope, baseline-versus-head failure comparison, no admin bypass,
          artifact-output contract (exactly one artifact, writable run-output
          directory only, never mutate Federation HQ).

  - id: review
    name: Independent Repair Reviewer
    description: Independently verifies the exact remote head and records a verdict.
    versions:
      - version: 0.1.0
        file: review/v0.1.0.md
        sha256: "82b9cc37176304d418a934b261fa5efa2374d4e886c5afdec3789eaa264479e9"
        status: released
        released: "2026-08-05"
        changelog: >
          Initial release for the three-role repair workflow: exact-head
          re-verification, claim-to-evidence checking, four verdicts,
          approval invalidated by new commits, artifact-output contract
          (exactly one artifact, writable run-output directory only, never
          mutate Federation HQ).

  - id: operator
    name: HQ Operator
    description: Coordinates the three-role repair workflow via GitHub-native structured Issue comments.
    versions:
      - version: 0.1.0
        file: operator/v0.1.0.md
        sha256: "17cd6f0e046dd75dd9393aabec80f409c5fc50ed8bfdb1097357f6069ff45a2c"
        status: released
        released: "2026-08-05"
        changelog: >
          Initial release for the HQ Operator coordination role: exactly one
          active role assignment per run, structural artifact acceptance,
          Issue-based coordination, no merge authority, no semantic repair
          judgment, no autonomous target selection, no model invocation.
          Pre-merge finalization (unmerged PR #3): submission references
          delivered bytes with hq_commit_sha null; acceptance references the
          canonical run-record branch commit with a matching hash; acceptance
          and next assignment are separate messages. No run pinned the earlier
          draft bytes.
      - version: 0.2.0
        file: operator/v0.2.0.md
        sha256: "6e054aa82e87608713d858e3f2b5116a33098e4fb4b5b867d63fc32b874a2994"
        status: released
        released: "2026-08-09"
        changelog: >
          MINOR additive release (Issue #15): automated role execution v0.1.
          Adds optional execution-adapter dispatch — the Operator may launch
          an ISOLATED role worker (scout/repair/review) through a compatible
          adapter instead of waiting for an external actor, observe its
          submission, and continue the normal validate -> canonicalize ->
          accept -> next-assignment loop. New section 'Automated role
          dispatch (execution adapters)' plus failure-visibility and
          fallback rules; independence invariant (repair and review run in
          distinct worker contexts; review never inherits repair's private
          reasoning); return-to-human conditions narrowed to terminal
          completion, policy decisions, unrecoverable execution failure, and
          permission/credential boundaries. Canonical protocol, artifacts,
          prompt pins, and Gate semantics unchanged; external/manual dispatch
          remains the supported fallback; no harness becomes part of the
          protocol vocabulary. Does not invalidate prior artifacts or runs
          pinned to operator@0.1.0.
