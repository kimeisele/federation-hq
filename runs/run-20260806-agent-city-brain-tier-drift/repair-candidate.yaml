defect_description: >
  ThoughtKind.SOCIAL_STRATEGY ("social_strategy") is an active and intended
  ThoughtKind in city/brain.py (line 50), but _KIND_TIER (lines 77-85)
  contains no corresponding routing entry. The contract test
  tests/test_brain.py::TestModelTier::test_all_thought_kinds_have_tier
  enforces that every active ThoughtKind has an explicit tier disposition and
  fails on the exact pinned baseline with "ThoughtKind 'social_strategy' has
  no tier mapping" (asserted at tests/test_brain.py:910). The runtime is not
  broken because _think() falls back silently to ModelTier.STANDARD
  (brain.py:477), which is exactly the implicit disposition the contract test
  exists to forbid.

  Intended contract (established from repository evidence): SOCIAL_STRATEGY is
  ACTIVE, not obsolete. Evidence: (1) it is a declared enum member with a
  doc comment; (2) Brain.evaluate_social_strategy() (brain.py:638) is a
  dedicated method with a purpose-built prompt override that routes
  "social_strategy" through _think(); (3) it has a live production call site,
  city/moltbook_assistant.py:179 (the DHARMA organic social engagement flow);
  (4) it was introduced by feature commit 2e5a50f "feat: implement step 8
  dynamic social cognition with confidence gate", which added the enum
  member, the method and the call path but never touched _KIND_TIER (0
  occurrences of _KIND_TIER in that commit's brain.py diff) — the tier entry
  was omitted at introduction. Retiring SOCIAL_STRATEGY would require
  removing the enum member, the method, the production call site and prompt
  paths — a larger, breaking change — and contradicts the feature commit's
  intent.

  Repair: add the explicit routing entry "social_strategy": ModelTier.STANDARD
  to _KIND_TIER in city/brain.py. STANDARD is the cheap workhorse tier
  (config/llm.yaml: standard resolves to deepseek/deepseek-v3.2, the same
  model all tiers use until Google direct is wired), consistent with the
  other content-understanding kinds (comprehension, discovery, insight,
  reflection). This makes the existing implicit disposition explicit without
  activating any provider or changing any configured model. tests/test_brain.py
  does not require correction: the test expresses the correct contract and
  passes once the entry exists.
