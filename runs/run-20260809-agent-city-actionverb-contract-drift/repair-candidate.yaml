defect_description: >
  The defect is a STALE TEST CONTRACT, not a production-code defect.
  tests/test_brain_action.py::TestActionVerb::test_all_9_verbs (line 33-34)
  asserts `len(ActionVerb) == 9`, but the intended ActionVerb vocabulary is
  10 members and PROPOSE_MISSION is an active, production-wired verb.
  Reproduction on the exact pinned baseline:
  `python -m pytest tests/test_brain_action.py::TestActionVerb -q` -> 1
  failed, 3 passed; failure `assert 10 == 9` at
  tests/test_brain_action.py:34. The count test was correct when written
  (commit 96c0b13, Schritt 2, enum had 9 members) and became stale when
  commit bcdcd34 added PROPOSE_MISSION to the enum and _VERB_AUTH without
  updating the test. PROPOSE_MISSION is intended and active: (1)
  city/brain_action.py:54 enum member "Public suggestion" under the
  "infer - propose new work" layer; (2) city/brain_action.py:83
  _VERB_AUTH[PROPOSE_MISSION] = AuthTier.PUBLIC "Anyone can suggest"; (3)
  city/intent_executor.py:177 registers handler
  handle_brain_propose_mission ("Idea-to-Action"); (4)
  city/intent_executor.py:460-513 implements the atomic flow
  compose->sign->NADI outbox persist->flush->GitHub Issue receipt with
  SHA-256 NADI_REF; (5) city/hooks/genesis/active_discovery.py:203-206
  emits operation="propose_mission" discovery signals; (6)
  tests/verify_step2_atomic.py is a dedicated test of
  _handle_brain_propose_mission atomicity/signature; (7) commit bcdcd34
  message: "Upgrade PROPOSE_MISSION and /mission commands to include
  machine-readable JSON payloads for the Steward Agent (A2A Bridge)".
  Every other completeness test in the same file is dynamic and already
  passes with 10 members (TestActionVerbCompleteness.test_all_verbs_have_
  auth_tier, test_parse_roundtrip, TestBrainIntentSignals.test_all_verbs_
  have_signals, test_signal_count_matches_verb_count), so removing
  PROPOSE_MISSION would break production wiring and those dynamic tests,
  while only the one hardcoded count test fails today. Intended behavior:
  the ActionVerb vocabulary is 10 members; the test contract must be
  reconciled to assert the intended cardinality (10) — or made
  non-brittle — without changing production code or Federation operations
  (repository-native triage docs agree: docs/MAINTENANCE_BASELINE_22_
  TRIAGE.md "reconcile enum and test cardinality without changing
  Federation operations"; docs/MAINTENANCE_CAMPAIGN_RECRUITMENT_BASELINE
  .json classifies this node as failure_cluster
  "stale_test_contract_drift"). Smallest repair scope: update
  tests/test_brain_action.py so the vocabulary-count assertion reflects
  the intended 10-member vocabulary (and rename the test if it is no
  longer "9"-specific); do NOT touch city/brain_action.py or any
  production code.
