defect_description: >
  The defect is a STALE TEST CONTRACT, not a production-code defect.
  Five Phase 5-7 integration tests in tests/test_layer5.py encode two
  pre-refactor contracts that the pinned baseline no longer implements:
  (1) implicit contract execution without an explicit ContractInvocation,
  and (2) one-phase-per-heartbeat MURALI accounting. Model decision
  (evidence-backed, Model B): the CityServiceRegistry is authoritative
  after Mayor construction; Mayor legacy fields (_contracts/_council)
  remain a one-way, construction/early-mutation compatibility input only.
  Evidence for Model B: CityServiceRegistry.register() unconditionally
  overwrites (city/registry.py:99-103 "Overwrites if already registered");
  MayorServiceBridge.sync_legacy_services() (city/mayor/services.py:54-58)
  is a non-overwriting bootstrap -- "register only if not has" -- re-run on
  every build_phase_context (city/mayor/context.py:22), so it never
  replaces a registry slot once claimed; PhaseContext exposes services
  ONLY through registry.get() properties (city/phases/__init__.py:163-164
  and siblings); no production site mutates or replaces Mayor legacy
  service fields after construction (grep over city/ for `._contracts =`,
  `._council =`, `._contract_invocation =` yields zero matches; production
  wires services via CityServiceFactory in city/factory.py:505-508
  (_build_contracts -> create_default_contracts) and city/runtime.py:150-153
  build_all). The test's late direct mutation IS honored at baseline
  (slots "contracts"/"council" are empty when first synced, so the test's
  registry/council are registered), so this is NOT an unsupported-direct-
  mutation failure and NOT a Model A compatibility bug (there is no
  production legacy reassignment that fails to update the registry).

  Reproduction at the exact pinned baseline (HEAD ==
  1cc173eef57e408a17494b3d13d696dbf4e54edb):
  `python3 -m pytest tests/test_layer5.py::test_contract_failure_creates_proposal -q`
  -> 1 failed: AssertionError "Failing contract should create a proposal"
  `assert 0 >= 1` at tests/test_layer5.py:499. Whole file
  `python3 -m pytest tests/test_layer5.py -q` -> 5 failed, 20 passed.

  Root-cause chain for test_contract_failure_creates_proposal
  (tests/test_layer5.py:462-503): the test sets mayor._council = council
  (line 475) and mayor._contracts = registry (line 491) and runs two
  heartbeats (lines 494-495). ContractsHook.execute()
  (city/hooks/dharma/contracts_issues.py:44-57) calls
  ctx.contracts.check_all(ctx.state_path.parent,
  invocation=ctx.contract_invocation); the test never sets
  mayor._contract_invocation (Mayor field defaults None), so
  ContractRegistry.check_all() short-circuits at city/contracts.py:181-188
  (invocation is None -> terminal_result "unavailable", reason_code
  "missing_policy") and returns ONLY a synthetic `contract_execution`
  FAILING result "Contract policy is required" -- the test's registered
  `test_contract` NEVER RUNS (observed governance_actions at baseline:
  `contract_audit:missing:unknown:unavailable:`,
  `contract_execution_unavailable:missing_policy`,
  `contract_failing:contract_execution:Contract policy is required`).
  ContractsHook then skips create_healing_mission/_submit_contract_proposal
  for `contract_execution` results (contracts_issues.py:56-57), so NO
  proposal is ever created (council._proposals stays empty; get_open_proposals()
  returns []). This invocation gate is the codified intended contract:
  tests/test_contract_policy.py:101-104 asserts invocation=None ->
  reason_code missing_policy, and the Layer-3/Layer-4 test helpers were
  migrated to auto-supply an invocation
  (tests/test_layer3.py:265-269 and tests/test_layer4.py:273-277:
  `kwargs["_contract_invocation"] = contracts.new_invocation("full",
  invocation_id="layer3-full")`); tests/test_layer5.py was never migrated.

  Even with an invocation supplied, the test's final assertion cannot pass
  under current heartbeat semantics: run_heartbeat()
  (city/mayor/execution.py:50-68) executes a FULL MURALI cycle per
  heartbeat ("one heartbeat = FULL MURALI cycle", commits 87693a0 and
  3ab5a13), and the DHARMA-created proposal is auto-voted (no buddhi ->
  VoteChoice.YES, city/karma_handlers/council.py:39-62) and
  executed/mark_executed in the SAME cycle's KARMA
  (city/karma_handlers/council.py:30-36), so get_open_proposals() is empty
  at assert time (verified empirically with an invocation: GOV-0001
  "Heal contract: test_contract" is created at heartbeat 0 and its status
  is EXECUTED after the same cycle). The related election-index failures
  are purely the heartbeat dimension: test_mayor_runs_election_in_dharma
  (tests/test_layer5.py:378-379) and test_full_rotation_with_council
  (lines 446-447) inspect results[1] (cycle #1) for "election:" actions,
  but the election runs in cycle #0's DHARMA (election_due(0) -> True, no
  seats; city/council.py:208-212) and is NOT due at heartbeat 1
  ((1 - 0) >= ELECTION_CYCLE(108) is False), so cycle #1 has no election
  actions; under the old one-phase-per-heartbeat model results[1] was the
  DHARMA phase and the election ran there.

  Hypothesis classification (of the seven listed): stale test from
  changed heartbeat semantics (option 1) AND stale test from the changed
  explicit contract-invocation contract (part of option 7); options 2
  (unsupported direct mutation -- refuted: the mutation is honored), 3
  (production compatibility bug -- refuted: no production legacy
  reassignment exists and sync preserves registered values), 4 (council
  election -- refuted: election works, member_count=3/elected_mayor=Beta),
  5 (contract execution -- refuted: missing_policy short-circuit is the
  codified intended behavior, test_contract_policy.py:101-104), and 6
  (proposal submission -- refuted: _submit_contract_proposal creates
  GOV-0001 when a real contract failure runs) are each disproven by
  baseline evidence.

  Minimal expected behavior: the Layer-5 Phase 5-7 tests
  (test_mayor_runs_election_in_dharma, test_full_rotation_with_council,
  test_contract_failure_creates_proposal, test_auto_vote_and_execute,
  test_full_feedback_loop) must be reconciled with the baseline's current
  contracts -- supply an explicit ContractInvocation for the installed
  ContractRegistry (the established Layer-3/Layer-4 pattern,
  tests/test_layer3.py:265-269) and re-express the per-phase result
  indexing and the open-proposal assertion for full-MURALI-cycle heartbeats
  (e.g., assert the proposal lifecycle OPEN -> PASSED -> EXECUTED across
  cycles, as test_auto_vote_and_execute:541-549 already intends). No
  production-code change is indicated by the evidence; do not modify
  city/mayor/, city/registry.py, city/contracts.py,
  city/hooks/dharma/contracts_issues.py, city/phases/dharma.py, or
  city/karma_handlers/council.py.
