[project]
name = "federation-node-kernel"
version = "0.1.0"
description = "Shared Python kernel for agent-federation nodes"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Ruff is pinned below 0.16: 0.16+ enables new default rules (e.g.
    # BLE001, S603 subprocess check=False) that flag the inherited
    # federation-kernel code, which was authored against earlier ruff
    # versions. The documented `ruff check .` must stay green on the whole
    # tree without touching kernel code.
    "ruff>=0.15,<0.16",
    "pyyaml>=6.0",
]
federation = [
    "nadi-kit @ git+https://github.com/kimeisele/steward-federation.git@v0.1.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["head_agent"]

[tool.setuptools.packages.find]
include = ["federation_hq_gate*"]
