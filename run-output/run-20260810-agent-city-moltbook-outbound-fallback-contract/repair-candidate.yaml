defect_description: >
  The defect is a STALE TEST CONTRACT, not a production-code defect.
  tests/test_treasury.py::TestMoltbookOutboundFallback::
  test_fallback_path_exists (tests/test_treasury.py:286-289) asserts that
  `city.hooks.moksha.outbound.MoltbookOutboundHook` exists and has a
  `_post_insight_or_fallback` attribute, but that class and method were
  deliberately removed from the codebase in an intentional architectural
  refactor and the outbound fallback behavior they represented is
  preserved and functional under the current class. Reproduction on the
  exact pinned baseline (HEAD == e01d011bd563e964afb55901a4ed9474191aec59):
  `python -m pytest tests/test_treasury.py::TestMoltbookOutboundFallback::
  test_fallback_path_exists -q` -> 1 failed; failure
  `ImportError: cannot import name 'MoltbookOutboundHook' from
  'city.hooks.moksha.outbound'` at tests/test_treasury.py:287. Whole file:
  1 failed, 26 passed (all other 8H MOKSHA decouple tests green). The
  rename/removal was deliberate and is fully documented in the baseline
  lineage: commit 249216d (2026-03-04, "8H: Decouple MOKSHA - Brain
  insight replaces raw dumps") introduced MoltbookOutboundHook with the
  static _post_insight_or_fallback and this test together; commit d97d0e7
  (2026-03-24, "chore: finalize step 6 outbound membrane") renamed the
  class to EventDrivenOutboundHook in city/hooks/moksha/outbound.py and
  removed _post_insight_or_fallback, replacing it with inline fallback
  logic inside execute() (city/hooks/moksha/outbound.py:186-200:
  "Fallback to technical brief if voice fails or unavailable" ->
  title=f"SIGNAL: {e_type.upper()}", then outbox enqueue via
  city.moltbook_outbox.append_message). The test was never updated during
  that refactor. Subsequent commits confirm the removal was intended, not
  accidental: c60621b (2026-03-26, outbox pattern) erroneously imported
  MoltbookOutboundHook from the NON-EXISTENT module
  city.hooks.moksha.moltbook_outbound in city/phases/moksha.py, and
  5c05eea (2026-03-26, "fix: entferne nicht existierenden import von
  moltbook_outbound") removed that broken import; no commit ever
  reintroduced the class. The current registration
  (city/phases/moksha.py:64-66) wires EventDrivenOutboundHook (pri=65) and
  MoltbookSenderHook (pri=66, drains the outbox via
  ctx.moltbook_bridge.create_post); `MoltbookOutboundHook` is referenced
  by no production code at the baseline (only stale comments in
  city/karma_handlers/gateway.py:583 and city/karma_handlers/sankalpa.py:
  262). The fallback BEHAVIOR still exists and works: exercising
  EventDrivenOutboundHook.execute with no LLM provider enqueued the
  technical brief ("SIGNAL: MISSION_COMPLETED", text "ID:
  mission_completed:mission-1 | HB: 42 | DATA: ...") to the outbox,
  recorded the broadcast in SignalStateLedger, and logged "OUTBOUND:
  Enqueued mission_completed:mission-1 to outbox"; no test at the
  baseline covers this current fallback path (grep over tests/ shows the
  only city.hooks.moksha.outbound imports are test_layer6 builders
  _build_city_report/_build_post_data, which still exist, and this stale
  test). The repository's own maintenance triage classifies this exact
  node: docs/MAINTENANCE_BASELINE_22_TRIAGE.md (Treasury cluster, order
  8) records the node with production risk "outbound fallback path /
  external side effect boundary" and smallest slice "decide whether
  MoltbookOutboundHook was intentionally removed; migrate the stale test
  or restore the narrow symbol" - the git evidence establishes intentional
  removal, so the stale test must be migrated. Intended behavior: the
  current authoritative Moltbook outbound contract is
  EventDrivenOutboundHook's event-driven fallback (BrainVoice narration;
  on voice absence/empty output, a deterministic technical brief is
  enqueued to city.moltbook_outbox and drained by MoltbookSenderHook).
  Smallest repair scope: migrate tests/test_treasury.py::
  TestMoltbookOutboundFallback::test_fallback_path_exists to assert the
  current contract (e.g. EventDrivenOutboundHook exists and its execute
  fallback path enqueues a technical brief to the outbox when BrainVoice
  is unavailable or empty) - or delete the stale assertion if the current
  fallback is covered elsewhere; do NOT reintroduce MoltbookOutboundHook
  (explicitly prohibited by the MissionContract hard constraint) and do
  NOT change any production outbound code (city/hooks/moksha/outbound.py,
  city/hooks/moksha/moltbook_sender.py, city/phases/moksha.py,
  city/moltbook_outbox.py, city/moltbook_bridge.py).
